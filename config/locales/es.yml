# Traducciones al español (tuteo).
# Mismas claves que en.yml: cualquier clave nueva debe añadirse en los dos archivos.
#
# Los nombres de meses/días, los mensajes de validación estándar ("no puede estar en blanco"),
# time_ago_in_words y los formatos de número (12,50 €) vienen de la gema rails-i18n.

es:
  # ---------- Fechas y horas (l(valor, format: :nombre)) ----------
  date:
    formats:
      display: "%-d %b %Y" # 6 oct 2026
      day_month: "%-d de %B" # 6 de octubre
      calendar_day: "%A, %-d de %B de %Y" # martes, 6 de octubre de 2026
      calendar_month: "%B de %Y" # octubre de 2026
      calendar_week_start: "%-d %b" # 5 oct
      calendar_week_end: "%-d %b %Y" # 11 oct 2026
  time:
    formats:
      display: "%-d %b %Y" # 6 oct 2026
      hour: "%H:%M" # 09:30
      short_datetime: "%-d %b, %H:%M" # 6 oct, 09:30
      full: "%-d %b %Y a las %H:%M" # 6 oct 2026 a las 09:30
  # time_ago_in_words / distance_of_time_in_words ("2 horas", "3 meses"…).
  # Sustituye el "alrededor de / casi / más de 2 años" de rails-i18n: solo número y unidad
  datetime:
    distance_in_words:
      about_x_hours:
        one: "%{count} hora"
        other: "%{count} horas"
      about_x_months:
        one: "%{count} mes"
        other: "%{count} meses"
      about_x_years:
        one: "%{count} año"
        other: "%{count} años"
      almost_x_years:
        one: "%{count} año"
        other: "%{count} años"
      over_x_years:
        one: "%{count} año"
        other: "%{count} años"

