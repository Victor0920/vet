  date:
    formats:
      display: "%b %-d, %Y" # Oct 6, 2026
      day_month: "%B %-d" # October 6
      calendar_day: "%A, %-d %B %Y" # Tuesday, 6 October 2026
      calendar_month: "%B %Y" # October 2026
      calendar_week_start: "%-d %b" # 5 Oct
      calendar_week_end: "%-d %b %Y" # 11 Oct 2026
  time:
    formats:
      display: "%b %-d, %Y" # Oct 6, 2026
      hour: "%H:%M" # 09:30
      short_datetime: "%b %-d, %H:%M" # Oct 6, 09:30
      full: "%b %-d, %Y at %H:%M" # Oct 6, 2026 at 09:30

