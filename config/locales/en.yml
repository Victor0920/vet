# English translations.
#
# How keys are organised:
#   - View keys mirror the view path, so `t(".title")` in app/views/products/index.html.erb
#     reads `en.products.index.title` ("lazy lookup"). Partials drop the underscore:
#     products/_form.html.erb -> `en.products.form.*`.
#   - `shared.*` holds words used across many pages (Cancel, Save changes…).
#   - `components.*` is for ViewComponents (they use full keys, not lazy ones).
#   - `activerecord.*` names models and attributes. Form labels (`f.label :name`),
#     `Model.human_attribute_name(:name)` and validation messages all read from here.
#   - `flash.*` is for notice/alert messages set in controllers.
#
# Keys with `one:`/`other:` are pluralized: t(".count", count: 3) -> "3 products".
# Keys ending in `_html` may contain HTML; values passed in are still escaped.
# Quote values that start with % or contain ": " so YAML reads them as strings.

en:
