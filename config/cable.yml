# Solid Cable in development too (instead of async): broadcasts are stored in the "cable" database
# and the server polls it, so a broadcast from bin/rails runner or the console reaches the browser.
# The async adapter only delivered broadcasts made inside the server process itself.
development:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
