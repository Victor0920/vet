<!doctype html>
<html lang="en">
  <head>
    <title>Something's wrong with that request (400 Bad request) · Vet</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="/icon.png" type="image/png">
    <!--
      Static error page: served by the web server even when Rails is down,
      so it can't use the asset pipeline. Colours mirror the tokens in
      app/assets/stylesheets/variables.css — keep them in sync by hand.
    -->
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      * { margin: 0; }

      body {
        display: grid;
        place-items: center;
        min-height: 100dvh;
        padding: 24px 16px;
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        color: #0f172a;               /* --gray-900 */
        background:
          radial-gradient(60rem 30rem at 50% -10%, #f0fdfa, transparent), /* --teal-50 */
          #f8fafc;                    /* --gray-50 */
        -webkit-font-smoothing: antialiased;
        text-align: center;
      }

      main { width: 100%; max-width: 28rem; }

      .brand {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        margin: 0 auto 32px;
        border-radius: 8px;
        background: #0d9488;          /* --teal-600 */
        color: #fff;
      }
      .brand svg { width: 22px; height: 22px; }

      .code {
        display: inline-block;
        margin-bottom: 12px;
        padding: 4px 10px;
        border-radius: 9999px;
        background: #f0fdfa;          /* --teal-50 */
        color: #0f766e;               /* --teal-700 */
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      h1 {
        font-size: 24px;
        font-weight: 600;
        line-height: 1.25;
        letter-spacing: -0.015em;
        text-wrap: balance;
      }

      p {
        margin-top: 8px;
        color: #475569;               /* --gray-600 */
        font-size: 16px;
        text-wrap: pretty;
      }

      .actions {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 32px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        height: 36px;
        padding: 0 16px;
        border: 1px solid transparent;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
        box-shadow: 0 1px 2px rgb(15 23 42 / 0.05);
        transition: background-color 120ms ease-out;
      }
      .btn:focus-visible { outline: none; box-shadow: 0 0 0 3px rgb(20 184 166 / 0.3); }
      .btn--primary { background: #0d9488; color: #fff; }
      .btn--primary:hover { background: #0f766e; }
      .btn--secondary { background: #fff; border-color: #cbd5e1; color: #0f172a; }
      .btn--secondary:hover { background: #f1f5f9; }

      .hint { margin-top: 40px; color: #64748b; font-size: 12px; } /* --gray-500 */
    </style>
  </head>

  <body>
    <main>
      <div class="brand"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><ellipse cx="6" cy="10" rx="2.2" ry="2.8"/><ellipse cx="10" cy="6" rx="2.2" ry="2.8"/><ellipse cx="14.5" cy="6" rx="2.2" ry="2.8"/><ellipse cx="18.5" cy="10" rx="2.2" ry="2.8"/><path d="M12.25 11.5c-2.6 0-5.75 3.6-5.75 6.1 0 1.6 1.2 2.4 2.6 2.4 1.3 0 2.1-.7 3.15-.7s1.85.7 3.15.7c1.4 0 2.6-.8 2.6-2.4 0-2.5-3.15-6.1-5.75-6.1Z"/></svg></div>
      <div class="code">400 · Bad request</div>
      <h1>Something's wrong with that request</h1>
      <p>The server couldn't process it. Please check the address or form and try again.</p>
      <div class="actions">
        <a class="btn btn--primary" href="/">Go to home</a>
        <a class="btn btn--secondary" href="javascript:history.back()">Go back</a>
      </div>
      <p class="hint">If you're the application owner, check the logs for more information.</p>
    </main>
  </body>
</html>
